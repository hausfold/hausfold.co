# Cloudflare Worker for hausfold.co — the landing page, /perch (and
# /perch/privacy), and the docs tree at /docs. Every other page this file used
# to name — /desktops/<name>, /haus, /pounce, and the seller's pages /terms and
# /refunds (retired 2026-08-16: hausfold sells nothing) — is a 301 now; see
# public/_redirects.
#
# Since 2026-08-14 there IS a `main`: `worker.js` carries the routes that can't
# be files — `/<desktop>.sh`, `/download/<app>`, `/api/release/<app>` and, since
# 2026-08-26, the `perch.hausfold.co` redirect.
#
# ⚠️ Assets no longer short-circuit ahead of it. `run_worker_first = true` below
# puts the Worker in front of every request, because the asset server matches on
# path and cannot see the hostname a short domain needs. Everything the Worker
# doesn't claim goes straight back out through the `ASSETS` binding, which is a
# route-table miss and a passthrough — cheap, but not free the way "the Worker
# never ran" was.
#
# The assets are BUILT (since 2026-08-12) — `npm run build` (Next + Fumadocs,
# `output: 'export'`) writes ./out, and Next copies ./public into it verbatim on
# the way. So the hand-written pages are served from exactly the same files you
# edit; the docs tree is new beside them.
#
# ./out is generated and gitignored. Anything that deploys this config has to
# run the build first — see .github/workflows/deploy.yml.
#
# `not_found_handling` was `single-page-application` while the site was one
# sheet — every path returned index.html with a 200, which is exactly right when
# there is only one page and exactly wrong once there are several: /desktops/typo
# would answer 200 with the landing page. `404-page` serves whatever is at
# ./out/404.html — generated at build time from `src/app/not-found.tsx`, not
# copied from `public/` — with a real 404 instead. Real paths still resolve
# first, and `html_handling` stays at its default (`auto-trailing-slash`),
# which is what maps /docs/haus/desktops/hacker to
# ./out/docs/haus/desktops/hacker/index.html.
# That directory-with-index shape is why `trailingSlash: true` is set in
# next.config.mjs — Next only exports it that way with the flag on, and this
# default is what serves it.
#
# `custom_domain = true` (rather than a `pattern = "hausfold.co/*"` route) is
# load-bearing: the zone has no DNS records at all, and a plain route needs a
# proxied record to already exist for the hostname. A custom domain makes wrangler
# create and proxy that record itself.
#
# Deploy (CI does this on push to main; this is the by-hand form):
#   cd hausfold.co && npm ci && npm run build && npx wrangler deploy
#                                           # (nixpkgs' wrangler fails to build — use npx)
#
# The directory was `hausfold` when this line was written, back when the layer
# still sat at `./hausfold` and the two were one dot apart. It is `hausfold.co`
# in the workshop now; the layer moved to `./haus`.
#
# The token needs, on the hausfold.co zone/account: Workers Scripts:Edit,
# Workers Routes:Edit, and Zone → DNS:Edit (for the custom-domain record).
name = "hausfold"
main = "worker.js"
compatibility_date = "2026-08-04"

# `perch.hausfold.co` is a SHORT URL, not a third site: worker.js 301s it to
# /docs/perch/install/ (see SHORT_DOMAINS there, and the rule it obeys). It is a
# custom domain for the same reason the two above are — the zone has no DNS
# records, so wrangler has to create and proxy the record itself.
routes = [
  { pattern = "hausfold.co", custom_domain = true },
  { pattern = "www.hausfold.co", custom_domain = true },
  { pattern = "perch.hausfold.co", custom_domain = true },
]

# `binding = "ASSETS"` is what lets worker.js hand a request it doesn't claim
# back to the asset server (404 page, `_redirects` and `_headers` included)
# instead of writing a second, worse 404 of its own.
[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"

# 🚨 Worker in front of EVERY request, and it has to be `true`.
#
# Measured in production 2026-08-26, the hard way. This was `["/"]` for one
# deploy — an attempt to pay for the Worker only on the site root, which is the
# only path that needs the hostname check for perch.hausfold.co. **An array is
# an ALLOWLIST, not an addition**: every path NOT in it is handed to the asset
# server outright, and `not_found_handling = "404-page"` then ANSWERS an
# unmatched path with 404.html instead of falling through to the Worker.
#
# So `["/"]` 404'd every Worker route on the site at once — `/haus.sh`,
# `/hacker.sh`, `/minimal.sh`, `/everyday.sh`, `/download/{perch,pounce}` and
# `/api/release/*`. The four installers are the URLs AGENTS.md calls the last
# thing here that may ever 404: they are in shell histories and in print.
#
# ⚠️ **`npm test` cannot catch this.** The Worker's own unit tests pass
# identically under either value, because they call `worker.fetch` directly and
# never go near the asset server.
#
# What catches it is worker.yml's grep, over this file and wrangler.preview.toml
# both, for the literal `run_worker_first = true` inside `[assets]`. A grep is
# crude and it is what there is: deploy.yml's post-deploy smoke check hits the
# live URLs, but Cloudflare answers a GitHub runner with a managed challenge
# ahead of the Worker often enough that it cannot be relied on — it warns and
# skips whenever that happens, and whether it happens varies run to run.
# 🚨 Don't delete the grep as a duplicate of it.
#
# The cost of `true` is one Worker invocation per request, whose fast path is a
# route-table miss falling straight through to `env.ASSETS.fetch(request)`.
#
# Why it is needed at all: assets match on PATH and know nothing about
# hostname, so `perch.hausfold.co/` matches `out/index.html` and would serve
# hausfold.co's landing page under the wrong domain, with worker.js never
# invoked and SHORT_DOMAINS never consulted.
run_worker_first = true

# Optional hard pin: uncomment and set REF to a tag to force every
# `/<desktop>.sh` at that ref for everyone, regardless of the latest release.
# Left unset, the Worker auto-resolves the desktop repo's latest GitHub release
# tag (cached ~1h), falling back to `main` before the first release exists.
# [vars]
# REF = "v2026.07.18"
