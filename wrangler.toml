# Cloudflare Worker for hausfold.co — the landing page (which carries the
# desktop catalogue itself since 2026-08-12), /desktops/<name>, /haus,
# /pounce, /perch, and the seller's pages (/terms, /refunds).
#
# There is no `main`: this is still a static-assets-only Worker and no Worker
# JS ever runs. What changed on 2026-08-12 is that the assets are now BUILT —
# `npm run build` (Next + Fumadocs, `output: 'export'`) writes ./out, and Next
# copies ./public into it verbatim on the way. So the hand-written pages are
# served from exactly the same files they always were; the docs tree is new
# beside them.
#
# ./out is generated and gitignored. Anything that deploys this config has to
# run the build first — see .github/workflows/deploy.yml.
#
# `not_found_handling` was `single-page-application` while the site was one
# sheet — every path returned index.html with a 200, which is exactly right when
# there is only one page and exactly wrong once there are several: /desktops/typo
# would answer 200 with the landing page. `404-page` serves whatever is at
# ./out/404.html — generated at build time from `src/app/not-found.tsx`, not
# copied from `public/` — with a real 404 instead. Real paths still resolve
# first, and `html_handling` stays at its default (`auto-trailing-slash`),
# which is what maps /desktops/nebelhaus to ./public/desktops/nebelhaus/index.html.
#
# `custom_domain = true` (rather than a `pattern = "hausfold.co/*"` route) is
# load-bearing: the zone has no DNS records at all, and a plain route needs a
# proxied record to already exist for the hostname. A custom domain makes wrangler
# create and proxy that record itself.
#
# Deploy (CI does this on push to main; this is the by-hand form):
#   cd hausfold.co && npm ci && npm run build && npx wrangler deploy
#                                           # (nixpkgs' wrangler fails to build — use npx)
#
# The directory was `hausfold` when this line was written, back when the layer
# still sat at `./hausfold` and the two were one dot apart. It is `hausfold.co`
# in the workshop now; the layer moved to `./haus`.
#
# The token needs, on the hausfold.co zone/account: Workers Scripts:Edit,
# Workers Routes:Edit, and Zone → DNS:Edit (for the custom-domain record).
name = "hausfold"
compatibility_date = "2026-08-04"

routes = [
  { pattern = "hausfold.co", custom_domain = true },
  { pattern = "www.hausfold.co", custom_domain = true },
]

[assets]
directory = "./out"
not_found_handling = "404-page"
