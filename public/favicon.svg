    <path transform="rotate(70)" fill="#e0e2b0" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(74)" fill="#e5e2b2" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(78)" fill="#eae2b2" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(82)" fill="#efe2b4" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(86)" fill="#f4e2b4" d="M0 0L79.85 -4.884 L79.85 4.884Z"/>
