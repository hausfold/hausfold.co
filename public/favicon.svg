  <!-- Everything that is NOT the stroke, painted back in the ground colour.
       Three subpaths under evenodd: the tile, then the mark's OUTER outline,
       then its INNER one. Outside the outer: 1 crossing, odd, ground. Between
       them: 2, even, the fan shows through, and that ring IS the stroke. Inside
       the inner: 3, odd, ground again.

       This is a stroke written out as two explicit polygons rather than an SVG
       stroke under a <mask> or a <clip-path>. Same picture, and the failure
       mode is the reason: a favicon is drawn in the restricted SVG-as-image
       context, and if a renderer there ever ignored the mask the fan would
       paint the whole tile as a rainbow square. Nothing can ignore fill-rule.
       The polygons are the base pentagon offset by half the stroke width with
       the mitres resolved by hand, so the apex still comes to a point. -->
  <path fill="#121212" fill-rule="evenodd"
        d="M0 0H100V100H0Z
           M50 13.51L78.22 47.97L78.22 86.48L21.78 86.48L21.78 47.97Z
           M50 30.57L67.42 51.83L67.42 75.68L32.58 75.68L32.58 51.83Z"/>
</svg>
