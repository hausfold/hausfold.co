    <path transform="rotate(10)" fill="#a6e1b4" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(14)" fill="#a7e1b1" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(18)" fill="#a8e1ae" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(22)" fill="#a9e1ab" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(26)" fill="#aae1a8" d="M0 0L79.85 -4.884 L79.85 4.884Z"/>
    <path transform="rotate(30)" fill="#aee1a6" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(34)" fill="#b3e1a8" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(38)" fill="#b8e1a8" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(42)" fill="#bde1aa" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(46)" fill="#c2e1aa" d="M0 0L79.85 -4.884 L79.85 4.884Z"/>
