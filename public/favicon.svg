<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    hausfold.co's favicon: the haus mark, on the dark field the desktop puts it
    on, swept through all six product accents.

    THE ONE COLOUR THE SITE KEEPS AT REST, and the only one. AGENTS.md's
    "greyscale at rest" rule names this as its third exception and says why: the
    other two are hover-gated, and a favicon has no hover state to gate on. It
    is still borrowed rather than owned — the same six product accents, read out
    of the same vendored nebelung port — so the house still shows no colour of
    its own. Nothing else here may take a hue at rest.

    It replaced a data: URI repeated in the <head> of all ten pages, which set
    U+2302 as TEXT in `font-family: monospace` at `x=2 y=13`. Three things were
    wrong with that and only one was the colour. The glyph sat wherever the
    browser's default mono face put it, which is off-centre left and low. It
    inherited that face's TEXT weight, a hairline once scaled to 16px. And on a
    machine whose mono font has no U+2302 it was tofu. The mark should not
    depend on a font it cannot choose, so it is geometry now, and it is one file
    rather than ten copies.

    SHAPE. Identical to the desktop's: `markPath` in haus's
    modules/wallpaper/package.nix, whose comment carries the derivation. The
    centrelines of the real codepoint traced off Menlo's `house` (SF Mono has no
    U+2302, so Menlo is what every Mac browser actually falls through to), walls
    0.77 as wide as the drawing is tall, roof/wall junction 53% up, and the roof
    slope ENDING on the wall with no eave, which is what reads as the ⌂ rather
    than as a generic house icon.

    Placed at scale 0.72 of that unit box, positioned so the STROKED extent —
    mitres included — is centred in the tile with a 13.5% margin top and bottom.
    Only top and bottom: the mark is 0.77 as wide as it is tall, so the side
    margins are 21.8% and equal margins on four sides would mean stretching it.
    Height is what's fitted. The apex mitre alone overshoots the path by 8.5
    units, which is why "centred" here cannot be read off the corner
    coordinates — 50 22.04 is the apex of the CENTRELINE, not of the drawing.

    WEIGHT. 0.15 of the mark's height, against the 0.09 that the desktop and the
    site's masthead share. Not a disagreement: 0.09 IS the glyph's own stem
    weight, and a stem drawn to type proportions is a hairline at 16px, which is
    where a favicon lives. 0.15 lands the stroke on about 1.7 device pixels at
    16px, which survives the downscale.

    COLOUR. The same six accents in the same order hausfold.css sweeps them
    (nebelung, scruff, perch, trill, pounce, hacker), as the Nebelung pastels,
    which are the set built to read on a dark field. The sweep is ANGULAR, from
    twelve o'clock turning clockwise, like the conic-gradient on the masthead
    and like the wallpaper's mark. SVG has no conic gradient, so it is fanned
    the way the wallpaper fans it: flat-coloured wedges off one ring, each
    sampled at its own bisector. A linear gradient was tried first and is the
    obvious wrong answer for this shape, because the mark is a RING: a linear
    ramp spends most of itself on the empty corners of the tile and repeats the
    same hue down both walls. The fan gives every direction its own colour,
    which is the point of the mark.

    THE FAN IS GENERATED, and its wedges are the only thing in this file that
    is. `node scripts/sync-nebelung.mjs` writes the block between the markers
    below out of the same vendored nebelung port the stylesheet reads, and its
    check mode (which CI runs) fails if it drifts — so a PIN bump moves the
    favicon with the palette instead of leaving a frozen snapshot behind. The
    ring, the wedge count, the radius and the fan's centre are constants in that
    script, not here; don't hand-edit the block. 90 wedges, where the wallpaper
    uses 240: the step between neighbours is invisible at every size a favicon
    is drawn at, and faintly bandable only if you render this SVG at 512, which
    nothing does.

    GROUND. #121212, the site's own dark ground: the dark theme's ground token
    in hausfold.css, and the dark `theme-color`. (Spelled out rather than
    written, because an XML comment may not contain two hyphens in a row and the
    whole palette is named that way.) It is crust, and the same script checks it
    against crust, for the reason it checks the ten theme-colours. The favicon
    carries its own field rather than borrowing the browser's, because the
    chrome behind a favicon is not knowable: Zen mats address-bar results on a
    light chip, tab strips are dark, and a pastel sweep on white is invisible
    while the light-theme accents on dark are mud. One field, both places, which
    is also why there is no prefers-color-scheme swap in here — the field never
    changes, so the accents that read on it never need to.

    WHERE IT SHOWS. Firefox/Zen and Chromium render this file directly.
    WebKit doesn't resolve an SVG favicon and falls back to /favicon.ico —
    which, since 2026-08-12, this site has: public/favicon.ico, generated by
    the same script from this file's own cover path below, monochrome rather
    than swept (see that script's "the ico fallback" section for why a colour
    copy would have been the frozen-palette problem this generator exists to
    prevent, and why monochrome sidesteps it entirely). Safari gets a flat
    ink house rather than the sweep; every other browser still gets this file.
  -->

  <!-- >>> nebelung — generated by scripts/sync-nebelung.mjs; do not edit by hand <<< -->
  <g transform="translate(50 51.56)">
    <path transform="rotate(-90)" fill="#caa8ef" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(-86)" fill="#cca8ea" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(-82)" fill="#cea7e6" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(-78)" fill="#d0a7e1" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(-74)" fill="#d2a7dd" d="M0 0L79.85 -4.884 L79.85 4.884Z"/>
