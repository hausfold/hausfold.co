<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    hausfold.co's favicon: the haus mark, on the dark field the desktop puts it
    on, swept through all six product accents.

    It replaced a data: URI repeated in the <head> of all ten pages, which set
    U+2302 as TEXT in `font-family: monospace` at `x=2 y=13`. Three things were
    wrong with that and only one was the colour. The glyph sat wherever the
    browser's default mono face put it, which is off-centre left and low. It
    inherited that face's TEXT weight, a hairline once scaled to 16px. And on a
    machine whose mono font has no U+2302 it was tofu. The mark is meant to be
    the one thing that looks the same everywhere, so it is geometry now, and it
    is one file rather than ten copies.

    SHAPE. Identical to the desktop's: `markPath` in haus's
    modules/wallpaper/package.nix, whose comment carries the derivation. The
    centrelines of the real codepoint traced off Menlo's `house` (SF Mono has no
    U+2302, so Menlo is what every Mac browser actually falls through to), walls
    0.77 as wide as the drawing is tall, roof/wall junction 53% up, and the roof
    slope ENDING on the wall with no eave, which is what reads as the ⌂ rather
    than as a generic house icon. Placed at 0.72 of that unit box, so the
    STROKED extent, mitres included, is centred with a 13.5% margin on all four
    sides. The apex mitre alone overshoots the path by 8.5 units, which is why
    "centred" here cannot be read off the corner coordinates.

    WEIGHT. 0.15 of the mark's height, against the 0.09 that the desktop and the
    site's masthead share. Not a disagreement: 0.09 IS the glyph's own stem
    weight, and a stem drawn to type proportions is a hairline at 16px, which is
    where a favicon lives. 0.15 lands the stroke on about 1.7 device pixels at
    16px, which survives the downscale.

    COLOUR. The same six accents in the same order hausfold.css sweeps them
    (nebelung, holt, perch, trill, pounce, nebelhaus), as the Nebelung pastels,
    which are the set built to read on a dark field. The sweep is ANGULAR, from
    twelve o'clock turning clockwise, like the conic-gradient on the masthead
    and like the wallpaper's mark. SVG has no conic gradient, so it is fanned
    the way the wallpaper fans it: flat-coloured wedges off one ring, sampled at
    each wedge's own bisector. A linear gradient was tried first and is the
    obvious wrong answer for this shape, because the mark is a RING: a linear
    ramp spends most of itself on the empty corners of the tile and repeats the
    same hue down both walls. The fan gives every direction its own colour,
    which is the point of the mark.

    90 wedges, where the wallpaper uses 240. The step between neighbours is
    invisible at every size a favicon is drawn at; it is faintly bandable if you
    render this SVG at 512, which nothing does. Regenerate with the same ring
    and it stays in agreement with the desktop.

    GROUND. #121212, the site's own dark ground: the dark theme's ground token
    in hausfold.css, and the dark `theme-color`. (Spelled out because an XML
    comment may not contain two hyphens in a row, and the whole palette is named
    that way.) The favicon carries its own field rather than borrowing the
    browser's, because the chrome behind a favicon is not knowable. Zen mats
    address-bar results on a light chip, tab strips are dark, and a pastel sweep
    on white is invisible while the light-theme accents on dark are mud. One
    field, both places, which is also why there is no prefers-color-scheme swap
    in here: the field never changes, so the accents that read on it never need
    to.
  -->

  <!-- The fan, painted over the whole tile and trimmed by the cover below. -->
  <g transform="translate(50 51.56)">
    <path transform="rotate(-90)" fill="#c7aaf0" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(-86)" fill="#c4aeee" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(-82)" fill="#c1b1ec" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(-78)" fill="#beb5ea" d="M0 0L79.85 -4.884 L79.85 4.884Z"/><path transform="rotate(-74)" fill="#bbb9e9" d="M0 0L79.85 -4.884 L79.85 4.884Z"/>
