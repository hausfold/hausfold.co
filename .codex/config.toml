# Project-scoped Codex config for hausfold.co.
#
# Instructions: AGENTS.md at the repo root — Codex reads it natively, no wiring.
# Flows: none repo-local; /ship and /docs-sync move changes between repos and
# live in the workshop. Both are shared with every other client; see
# .agents/README.md.
#
# This file only carries the one thing AGENTS.md can't express: the session hook
# that installs Nix in a cloud container, which `scripts/sync-nebelung.mjs`
# needs and nothing else here does.

[hooks]
file = ".codex/hooks.json"

[features]
hooks = true

# Two caveats, both upstream, both harmless if they bite:
#   * repo-local hooks have historically not fired in every interactive session
#     (openai/codex#17532) — if `/hooks` doesn't list this one, add
#     `hooks = "<abs path>/.codex/hooks.json"` to your own ~/.codex/config.toml;
#   * some builds want an absolute path here. Either way the fallback is the
#     same as for any harness with no hooks at all: run ./.agents/setup.sh once.
