# PR-only Worker config: wrangler.toml's asset settings, with `routes` dropped
# and `workers_dev` added. No routes means the preview Worker is reachable only
# on workers.dev and cannot take the hausfold.co hostname.
#
# That property is enforced, not just documented — preview.yml's "Refuse a
# preview config that defines routes" step fails the job if a `routes` block
# appears here (this file is read from the PR head, so a comment alone would
# protect nothing).
#
# The workflow overrides `name` with hausfold-pr-<number>, which is what makes
# each PR's URL stable across pushes.
#
# `directory` tracks wrangler.toml's: ./out, the built export. The preview job
# runs `npm ci && npm run build` before uploading, so a PR preview shows the
# docs as they would actually deploy rather than the raw ./public tree.
#
# `main` tracks it too, so a preview URL answers `/hacker.sh`,
# `/download/<app>` and `/api/release/<app>` — the only way to *feel* an
# installer change before it becomes the install command, since those three are
# the part of this site no local file shows.
#
# `run_worker_first` tracks it as well, and has to: without it the asset server
# short-circuits every path it can match and `not_found_handling = "404-page"`
# answers the rest, so `/hacker.sh` and friends 404 on the preview URL while
# production serves them. That is the same failure #159 fixed in production and
# the same one preview.yml's routes check exists to prevent a version of — a PR
# whose installer change looks fine here precisely because the Worker never ran.
# worker.yml asserts both configs carry it.
#
# ⚠️ One dimension it can NOT reproduce: Cloudflare's Cache API is a no-op on
# workers.dev, so the ~1h release-tag cache never holds here and every preview
# request hits api.github.com unauthenticated. Past the shared-IP rate limit
# the preview quietly falls back to `main` while production serves the release
# tag — so a preview serving a different script than you expect is a rate
# limit, not a bug in the change you are looking at.
name = "hausfold-preview"
main = "worker.js"
compatibility_date = "2026-08-04"
workers_dev = true

[assets]
directory = "./out"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true
