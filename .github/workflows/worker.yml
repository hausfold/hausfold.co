# The Worker's own tests. `worker.js` is the one file on this site that isn't a
# page: it carries the `curl | bash` installer, so its ref validation is the
# only place here where a bug is a security bug rather than a typo.
#
# Deliberately separate from Docs (build + type-check + lint) — that job is
# minutes of Next build to say nothing about the Worker, and this one is
# seconds. Ported from the workshop's web/ suite along with the Worker itself.
name: Worker

on:
  pull_request:
    paths:
      - 'worker.js'
      - 'worker-api.js'
      - 'worker-config.js'
      - 'test/**'
      - 'wrangler.toml'
      - 'wrangler.preview.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker.yml'
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'worker-api.js'
      - 'worker-config.js'
      - 'test/**'
      - 'wrangler.toml'
      - 'wrangler.preview.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/worker.yml'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - run: npm test

      # The two configs have to agree about the Worker or the preview stops
      # being a preview: a `main` here and none there means a PR's installer
      # change looks fine on workers.dev because the route isn't running at all.
      - name: Both wrangler configs run the same Worker
        run: |
          for f in wrangler.toml wrangler.preview.toml; do
            grep -q '^main = "worker.js"' "$f" \
              || { echo "::error file=$f::$f must set main = \"worker.js\" — the live config and the preview config have to run the same Worker."; exit 1; }
            # Inside [assets] specifically: a `binding` under some other table
            # would satisfy a bare grep and bind nothing the Worker can reach.
            sed -n '/^\[assets\]/,/^\[/p' "$f" | grep -q '^binding = "ASSETS"' \
              || { echo "::error file=$f::$f must set binding = \"ASSETS\" inside [assets] — worker.js hands unclaimed paths back through it."; exit 1; }
            # 🚨 `true`, never an array. An array is an ALLOWLIST: every path
            # outside it goes to the asset server, whose `not_found_handling`
            # then answers it, so the Worker's own routes stop being reached.
            # `["/"]` shipped on 2026-08-26 (#159) and 404'd all four installers
            # plus /download/* and /api/release/* at once. This is a text check
            # because nothing else can be: the unit tests call `worker.fetch`
            # directly and pass under either value, and the live smoke check in
            # deploy.yml is answered with a Cloudflare challenge from a runner.
            # Scoped to [assets] for the same reason as the binding above: it is
            # an [assets] key, and a top-level one would satisfy a bare grep
            # while doing nothing.
            sed -n '/^\[assets\]/,/^\[/p' "$f" | grep -q '^run_worker_first = true$' \
              || { echo "::error file=$f::$f must set run_worker_first = true. An array is an allowlist — every path outside it is answered by the asset server and the Worker's routes stop being reached (see #159)."; exit 1; }
          done
          echo "Both configs run worker.js with the ASSETS binding, Worker first."
