# Check that public/hausfold.css and public/favicon.svg still agree with
# nebelung's CSS port.
#
# The dark theme's ten nebelung values used to be hand-copied hexes, written
# twice each (once for `prefers-color-scheme`, once for the `data-theme`
# toggle) — twenty literals with nothing watching them. They're now
# `var(--nebelung-*)` reading a block that scripts/sync-nebelung.mjs vendors
# from `github:hausfold/nebelung`, and this job runs that same script with
# --check.
#
# Most of what it fails on is fixed by one command:
#
#   node scripts/sync-nebelung.mjs
#
# — the vendored block being stale or hand-edited, chiefly. Three failures are
# NOT fixed by re-running it, and it says so rather than pretending:
#
#   - a `--nebelung-*` name that stopped existing upstream. Re-running would
#     leave a dangling var() and a dark page with no background, so the script
#     refuses to write; re-point the token by hand.
#   - --ink or --well drifting apart between the two dark blocks, or stopping
#     being literals. They are deliberately not nebelung's.
#   - `themeColor.dark` in `src/lib/shared.ts` no longer equalling crust. It is
#     a hand-typed copy of the palette and no template generates it — but there
#     is exactly one of it, and `viewport` in `src/app/layout.tsx` spends it on
#     every route. It used to be ten <meta>s hand-copied across
#     `public/**.html`, walked here because there was nothing else to read;
#     the landing pages became Next routes and stopped carrying heads of their
#     own, so the copies and the "a new page owes one" hazard went with them.
#   - public/favicon.svg's ground drifting off crust — the tile is hand-drawn
#     and only its wedge fan is generated — or two hyphens in a row appearing
#     in its comment, which is an XML parse error that no browser reports: the
#     tab just shows a blank page icon and the site looks like it never had a
#     favicon.
#   - public/favicon.ico (the Safari fallback, since 2026-08-12) decoding to
#     different pixels than what the mark, --ink and crust would generate.
#     Decoded pixels, not raw bytes: an earlier version of this check compared
#     bytes and broke on its own first CI run — the file zlib.deflateSync
#     produces for the same pixels isn't promised stable across zlib versions,
#     and this job's runner doesn't always match a contributor's local Node.
#
# **`src/lib/shared.ts`, `public/favicon.svg` and `public/favicon.ico` are in
# the paths filter for those, and they have to be.** Those checks read a TS
# module, an SVG and a binary icon, not CSS, so filtering on
# `public/hausfold.css` + `scripts/**` alone meant a theme-colour- or icon-only
# PR — a hand-edited `themeColor`, a stale favicon.ico — never ran the check
# watching it. A check that can't see the file it checks is a check that
# reports "matches" about a file it never read. (`public/**.html` was in this
# list until the landing pages became Next routes; there are no HTML files
# under `public/` any more.)
#
# It builds a **pinned** revision of nebelung (PIN in the script), not `main`.
# So this job is deterministic: it goes red for things the PR did, never for
# something nebelung merged that morning. A check that fails for reasons you
# didn't cause is a check people learn to skip.
#
# The trade is that upstream drift is pulled, not pushed — nothing here will
# tell you nebelung moved. `node scripts/sync-nebelung.mjs --latest` asks, and
# names the values a bump would actually change. No secrets, so this runs on
# forks too.
name: Palette

on:
  pull_request:
    paths:
      - 'public/hausfold.css'
      - 'src/lib/shared.ts'
      - 'public/favicon.svg'
      - 'public/favicon.ico'
      - 'scripts/**'
      - '.github/workflows/palette.yml'
  push:
    branches: [main]
    paths:
      - 'public/hausfold.css'
      - 'src/lib/shared.ts'
      - 'public/favicon.svg'
      - 'public/favicon.ico'
      - 'scripts/**'
      - '.github/workflows/palette.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: palette-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - run: node scripts/sync-nebelung.mjs --check
