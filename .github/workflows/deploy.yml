# Deploy hausfold.co to Cloudflare.
#
# Fires when the pages, the docs, the Worker (or its config), or this workflow
# change on main, or on demand. Since 2026-08-12 there IS a build step: `npm run build`
# writes ./out (the Next/Fumadocs static export, with ./public copied into it),
# and that is what `wrangler deploy` uploads. ./out is gitignored, so a deploy
# that skips the build uploads nothing.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token on the account that owns the hausfold.co
#                            zone, with Workers Scripts:Edit, Workers
#                            Routes:Edit, and Zone → DNS:Edit. DNS:Edit is
#                            load-bearing: the routes are `custom_domain`, and
#                            wrangler creates/proxies the records itself.
#   CLOUDFLARE_ACCOUNT_ID  — dashboard → Workers & Pages → Account details.
# Optional (enables the post-deploy cache purge):
#   CLOUDFLARE_ZONE_ID     — dashboard → hausfold.co → Overview → API, bottom
#                            right. The token also needs Zone → Cache Purge.
#                            Without it the purge step warns and the deploy
#                            still succeeds.
#
# A token scoped to another zone will not work here — pointing one at this
# zone is exactly the setup cost that kept this repo on hand-deploys while it
# lived in the workshop.
name: Deploy hausfold.co

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'content/**'
      - 'src/**'
      - 'worker.js'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        run: |
          npm ci
          npm run build

      # The Worker carries the `curl | bash` install URL, so its tests run on
      # the way to the live site as well as on the PR — a merge queue that
      # skipped them once is all it takes for a red suite to become an install.
      - name: Test the Worker
        run: npm test

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 🚨 The check that `npm test` structurally cannot do.
      #
      # Every route below lives in worker.js, and whether the Worker is REACHED
      # is decided by wrangler.toml (`run_worker_first`) and by Cloudflare's
      # asset server — neither of which the unit tests touch. They call
      # `worker.fetch` directly, so they pass whether or not a real request ever
      # gets there. On 2026-08-26 `run_worker_first = ["/"]` shipped green and
      # 404'd every route in this list at once, the four installers included.
      #
      # `curl | bash` URLs are the last thing on this site that may ever 404, so
      # this runs against the LIVE site immediately after the deploy that could
      # have broken it, and fails the workflow if any of them stops answering.
      - name: Smoke-test the Worker routes against the live site
        run: |
          set -uo pipefail
          fail=0

          # `curl | bash` installers: must be 200 and must be a shell script,
          # not the 404 page dressed as one.
          for name in haus hacker minimal everyday; do
            body=$(curl -fsS --max-time 20 "https://hausfold.co/$name.sh" || true)
            if printf '%s' "$body" | head -1 | grep -q '^#!'; then
              echo "ok    /$name.sh"
            else
              echo "::error::/$name.sh did not return a shell script — the Worker is not being reached"
              fail=1
            fi
          done

          # Download + release metadata: a 302 to GitHub, and JSON naming a tag.
          for app in perch pounce; do
            code=$(curl -s -o /dev/null --max-time 20 -w '%{http_code}' "https://hausfold.co/download/$app")
            loc=$(curl -s -o /dev/null --max-time 20 -w '%{redirect_url}' "https://hausfold.co/download/$app")
            case "$code:$loc" in
              30?:https://github.com/hausfold/$app/releases/download/*) echo "ok    /download/$app -> $loc" ;;
              *) echo "::error::/download/$app answered $code -> ${loc:-<none>}"; fail=1 ;;
            esac

            if curl -fsS --max-time 20 "https://hausfold.co/api/release/$app" | grep -q '"tag":"v'; then
              echo "ok    /api/release/$app"
            else
              echo "::error::/api/release/$app did not return release JSON"
              fail=1
            fi
          done

          # The short domain: a 301 to the install page, never a page of its own.
          loc=$(curl -s -o /dev/null --max-time 20 -w '%{redirect_url}' "https://perch.hausfold.co/")
          if [ "$loc" = "https://hausfold.co/docs/perch/install/" ]; then
            echo "ok    perch.hausfold.co/ -> $loc"
          else
            echo "::error::perch.hausfold.co/ went to '${loc:-<nowhere>}' instead of the install page"
            fail=1
          fi

          # And the site itself still serves, so a passthrough regression shows
          # up here rather than as a quiet outage.
          curl -fsS --max-time 20 -o /dev/null "https://hausfold.co/" \
            && echo "ok    hausfold.co/" \
            || { echo "::error::hausfold.co/ did not answer"; fail=1; }

          exit "$fail"

      # Every page URL is un-hashed — `/`, `/perch`, `/docs/…` all keep their
      # URL when their contents change — so a deploy with no purge can
      # leave the old copy in front of visitors for as long as Cloudflare's
      # default cache decides. The worst case is a cached page still asking for
      # a `/_next/static/*` bundle the new build renamed: that reads as broken
      # rather than old. Purging is the only way to make a content change land
      # immediately.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID not set — skipping cache purge. Add the secret (and give the token Zone → Cache Purge) to enable it."
            exit 0
          fi
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            || { echo "::error::Cloudflare cache purge failed (see response above)"; exit 1; }
          echo "Purged the hausfold.co cache."
