# Deploy hausfold.co to Cloudflare.
#
# Fires when the pages, the docs, the Worker config, or this workflow change on
# main, or on demand. Since 2026-08-12 there IS a build step: `npm run build`
# writes ./out (the Next/Fumadocs static export, with ./public copied into it),
# and that is what `wrangler deploy` uploads. ./out is gitignored, so a deploy
# that skips the build uploads nothing.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   — a token on the account that owns the hausfold.co
#                            zone, with Workers Scripts:Edit, Workers
#                            Routes:Edit, and Zone → DNS:Edit. DNS:Edit is
#                            load-bearing: the routes are `custom_domain`, and
#                            wrangler creates/proxies the records itself.
#   CLOUDFLARE_ACCOUNT_ID  — dashboard → Workers & Pages → Account details.
# Optional (enables the post-deploy cache purge):
#   CLOUDFLARE_ZONE_ID     — dashboard → hausfold.co → Overview → API, bottom
#                            right. The token also needs Zone → Cache Purge.
#                            Without it the purge step warns and the deploy
#                            still succeeds.
#
# Do NOT reuse the nebelhaus.com token: it's scoped to that zone, and pointing
# it at this one is exactly the setup cost that kept this repo on hand-deploys
# while it lived in the workshop.
name: Deploy hausfold.co

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'content/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.mjs'
      - 'postcss.config.mjs'
      - 'tsconfig.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: {}

# Never let two deploys race; a newer push supersedes an in-flight one.
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the site
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Every hand-written asset is un-hashed — the HTML pages and hausfold.css
      # all keep their URL when their contents change — so a deploy with no purge can
      # leave the old copy in front of visitors for as long as Cloudflare's
      # default cache decides. A stale stylesheet against fresh markup is the
      # worst case: it reads as broken rather than old. Purging is the only
      # way to make a content change land immediately.
      - name: Purge Cloudflare cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ZONE_ID" ]; then
            echo "::warning::CLOUDFLARE_ZONE_ID not set — skipping cache purge. Add the secret (and give the token Zone → Cache Purge) to enable it."
            exit 0
          fi
          resp=$(curl -fsS -X POST \
            "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$resp"
          echo "$resp" | grep -q '"success":true' \
            || { echo "::error::Cloudflare cache purge failed (see response above)"; exit 1; }
          echo "Purged the hausfold.co cache."
