# Keep the generated options reference aligned with haus's committed site data.
#
# A push or pull request hard-fails on drift. A scheduled or manual run has no
# branch to fix, so it regenerates the page and opens or updates one long-lived
# PR. The derivation stays in haus; this repository only reads JSON.
name: options drift

on:
  schedule:
    - cron: '30 9 * * 1'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'scripts/gen-options.mjs'
      - 'content/docs/haus/reference/options.mdx'
      - '.github/workflows/options-drift.yml'
  pull_request:
    paths:
      - 'scripts/gen-options.mjs'
      - 'content/docs/haus/reference/options.mdx'
      - '.github/workflows/options-drift.yml'

# Cancel a superseded PR run, and only a PR run: any other event keys on its
# own commit, so a merge run of main is never cancelled by the next merge.
concurrency:
  group: options-drift-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hausfold/haus
          path: .haus

      - run: node scripts/gen-options.mjs --haus .haus --check

  regenerate:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hausfold/haus
          path: .haus

      - run: node scripts/gen-options.mjs --haus .haus

      # Nothing but this workflow writes ci/options-drift, so replacing its
      # history keeps repeated Monday runs on one PR without rewriting a human
      # branch — and lets a run with no drift retire the branch outright.
      - name: Open, update or retire the drift PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          page=content/docs/haus/reference/options.mdx
          branch=ci/options-drift

          # An open drift PR cannot survive main catching up with it. Its own
          # `check` job re-renders against haus's tip, so the day anyone
          # regenerates the page on main the PR's older render goes stale and
          # stays red — and this job, seeing no drift, used to exit without
          # touching it. Nothing else writes the branch, so retiring it here is
          # the only thing that ever clears that.
          if git diff --quiet -- "$page"; then
            echo "options reference is current — nothing to open."
            # An empty listing and a failed one look identical once the exit
            # status is thrown away, and one of them means "delete the branch".
            # So keep them apart: a flake leaves everything where it is.
            if ! open=$(gh pr list --head "$branch" --state open --json number -q '.[].number'); then
              echo "::warning::could not list PRs for ${branch} — leaving it alone this run."
              exit 0
            fi
            open=$(printf '%s\n' "$open" | head -n1)

            if [ -n "$open" ]; then
              # shellcheck disable=SC2016  # the backticks are markdown, not a subshell
              gh pr close "$open" --delete-branch --comment \
                'Superseded: the options reference on `main` already matches haus, so this branch has nothing left to add. Merging it now would take the page backwards. `options-drift.yml` opens a fresh PR the next time haus and the page disagree.'
              echo "closed #${open} and deleted ${branch}."
            elif git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              git push origin --delete "$branch"
              echo "deleted the leftover ${branch}."
            fi
            exit 0
          fi

          haus_sha=$(git -C .haus rev-parse --short HEAD)

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add "$page"
          git commit -m "docs: regenerate the options reference (haus ${haus_sha})"
          git push --force origin "$branch"

          compare="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"

          if [ -n "$(gh pr list --head "$branch" --state open --json number -q '.[].number')" ]; then
            echo "existing PR updated with haus ${haus_sha}."
            exit 0
          fi

          cat > /tmp/pr-body.md <<BODY
          \`reference/options.mdx\` had drifted from haus's module system. This PR is
          the regenerated page — opened by \`options-drift.yml\`'s weekly run, against
          haus [\`${haus_sha}\`](https://github.com/hausfold/haus/commit/${haus_sha}).

          Nothing here was written by hand: \`scripts/gen-options.mjs\` renders the
          whole page from haus's committed site data. Skim the diff for surprises,
          then merge.

          If the diff looks wrong, the fix belongs in haus's option declarations,
          not here. This page has no independent copy to correct.

          This branch is force-pushed by CI every Monday it finds drift, so it stays a
          single moving PR rather than a stack of stale ones.
          BODY

          if gh pr create --base main --head "$branch" \
               --title 'docs: regenerate the options reference' \
               --body-file /tmp/pr-body.md; then
            exit 0
          fi

          echo "::warning::could not open the PR automatically — enable Actions to create pull requests in the org settings"
          echo "::notice::branch ${branch} is pushed and ready: ${compare}"
          exit 1
